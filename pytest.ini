[pytest]
testpaths = tests
addopts = --alluredir=reports/allure-results -v
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    smoke: test cases cơ bản, chạy nhanh
    regression: test cases đầy đủ
    non_login: chưa đăng nhập
    free: tài khoản Free
    plus: tài khoản Plus
    premium: tài khoản Premium
    offline: không có mạng
